    <path class="arrive" style="animation-delay:1.98s" d="M962.6 78.8A142 142 0 0 1 991.7 78.8" fill="none" stroke="#afd476" stroke-width="34"/>
    <path class="arrive" style="animation-delay:1.70s" d="M996.8 79.4A142 142 0 0 1 1025.1 86.3" fill="none" stroke="#5e980e" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.42s" d="M1029.9 88.2A142 142 0 0 1 1055.7 101.7" fill="none" stroke="#578d0f" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.14s" d="M1059.9 104.6A142 142 0 0 1 1081.7 123.9" fill="none" stroke="#508210" stroke-width="28"/>
