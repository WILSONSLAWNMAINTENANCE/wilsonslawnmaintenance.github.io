    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="67.8" fill="#65a30d" font-size="15" font-weight="700" letter-spacing=".6">wilsonslawnmaintenance.github.io</text><text x="56" y="114.2" fill="#ecfccb" font-size="40" font-weight="700" letter-spacing="-.5">Wilson's Lawn Maintenance</text><text x="56" y="154.8" fill="#cfdeb2" font-size="23">The front door: a crew check-in, and your lawn this</text><text x="56" y="185.6" fill="#cfdeb2" font-size="23">month.</text></g>
  </g>
</svg>
